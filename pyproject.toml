[tool.uv.workspace]
members = ["bindings/python"]

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "ruff>=0.14,<1",
    "nbtlib>=2,<3",
    "litemapy>=0.11.0b0,<0.12",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
