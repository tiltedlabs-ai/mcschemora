[package]
name = "mcschemora-python"
version.workspace = true
edition = "2024"
publish = false
description = "Python bindings for Minecraft schematic authoring, conversion, and rendering"
license = "MIT"
repository = "https://github.com/whuang37/schemora"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
mcschemora = { path = "../.." }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

pollster = "0.4"

[build-dependencies]
serde_json = "1"
