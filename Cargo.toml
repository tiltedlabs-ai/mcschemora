[package]
name = "mcschemora"
version = "0.1.0"
edition = "2024"
description = "Minecraft schematic authoring and conversion"
license = "MIT"
include = ["/data/wiki-sprites/**", "/data/entity-models/**", "/data/block-models/**", "/src/**/*.rs", "/src/catalog/storage/native/SOURCE.md", "/examples/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "mcschemora"
crate-type = ["rlib"]

[workspace]
members = ["bindings/python", "bindings/wasm"]
default-members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2"
fastsnbt = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
fs2 = "0.4"
tempfile = "3"
sha1 = "0.10"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Response", "Headers"] }
