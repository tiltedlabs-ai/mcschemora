[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "mcschemora"
version = "0.1.0"
description = "Minecraft schematic authoring"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[tool.maturin]
python-source = "python"
module-name = "mcschemora._core"
include = [{ path = "licenses/**/*", from = "out-dir", to = "mcschemora/" }]
exclude = ["**/__pycache__/**", "**/*.pyc", "python/mcschemora/licenses/**/*"]
