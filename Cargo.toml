[package]
name = "schemora"
version = "0.1.0"
edition = "2024"
description = "Minecraft schematic authoring and conversion"
license = "MIT AND MPL-2.0"
include = ["/data/entity-models/**", "/data/block-models/**", "/src/**/*.rs", "/src/mc_data/SOURCE.md", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "schemora"
crate-type = ["rlib"]

[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2"
fastsnbt = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
fs2 = "0.4"
tempfile = "3"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
