[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "schemora"
version = "0.1.0"
description = "Minecraft schematic authoring"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

[tool.maturin]
python-source = "python"
module-name = "schemora._core"
exclude = ["**/__pycache__/**", "**/*.pyc"]
